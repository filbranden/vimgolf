name: Vimgolf CI
on:
  - push

jobs:
  rspec-rails-macos:
    runs-on: macos-latest
    steps:
      - name: Check out git tree
        uses: actions/checkout@v2
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1
      - name: Dump pgsql build config
        run: |
          set -x
          which pg_config
          ls -l $(which pg_config)
          pg_config --includedir
          pg_config --libdir
          pg_config --cppflags
          pg_config --ldflags
          pg_config --libs
      - name: Get Ruby version
        run: ruby --version
      - name: Require pg gem
        run: bundle exec ruby -e 'require "pg"'
