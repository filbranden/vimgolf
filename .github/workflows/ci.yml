name: Vimgolf CI
on:
  - push

jobs:
  rspec-rails-macos:
    runs-on: macos-latest
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.6'
          bundler-cache: false
      - name: Dump pgsql build config
        run: |
          set -x
          which pg_config
          ls -l $(which pg_config)
          pg_config --includedir
          pg_config --libdir
          pg_config --cppflags
          pg_config --ldflags
          pg_config --libs
      - name: Get Ruby version
        run: ruby --version
      - name: Build pg Ruby gem
        run: gem install -V --version '1.2.3' pg
      - name: Require pg gem
        run: ruby -e 'require "pg"'
